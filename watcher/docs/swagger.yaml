basePath: /
definitions:
  handlers.RequestReportPayload:
    properties:
      data:
        description: Flexible JSON payload containing report content
        items:
          type: integer
        type: array
      report_type:
        description: e.g. "project_summary"
        type: string
    type: object
  models.AuditLog:
    properties:
      duration_ms:
        type: integer
      id:
        type: integer
      method:
        type: string
      path:
        type: string
      req_body:
        type: string
      status_code:
        type: integer
      timestamp:
        type: string
      user_id:
        type: string
    type: object
  models.ReportJob:
    properties:
      completed_at:
        $ref: '#/definitions/sql.NullTime'
      created_at:
        type: string
      download_url:
        type: string
      error_message:
        type: string
      id:
        type: integer
      input_data:
        description: Store input JSON string
        type: string
      minio_bucket:
        type: string
      minio_key:
        type: string
      report_type:
        type: string
      status:
        description: pending, processing, completed, failed
        type: string
      updated_at:
        type: string
    type: object
  sql.NullTime:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
host: localhost:8082
info:
  contact: {}
  description: API service for Arthemis Watcher.
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Arthemis Watcher API
  version: "1.0"
paths:
  /audit/log:
    post:
      consumes:
      - application/json
      description: Receives an audit log entry and saves it to the database
      parameters:
      - description: Audit Log entry payload
        in: body
        name: entry
        required: true
        schema:
          $ref: '#/definitions/models.AuditLog'
      produces:
      - application/json
      responses:
        "201":
          description: Created audit log entry
          schema:
            $ref: '#/definitions/models.AuditLog'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to save to database
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create Audit Log
      tags:
      - audit
  /health:
    get:
      description: Evaluates the status of the server and database
      produces:
      - application/json
      responses:
        "200":
          description: Successful response containing status, db connection, and timestamp
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - health
  /reports:
    post:
      consumes:
      - application/json
      description: Creates an asynchronous report generation job and enqueues it.
      parameters:
      - description: Report Request payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/handlers.RequestReportPayload'
      produces:
      - application/json
      responses:
        "202":
          description: Job accepted and enqueued
          schema:
            $ref: '#/definitions/models.ReportJob'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to create job
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request Report
      tags:
      - reports
  /reports/{id}:
    get:
      description: Retrieves the status of a report job by ID. If complete, returns
        the temporary MinIO download URL.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Current job details
          schema:
            $ref: '#/definitions/models.ReportJob'
        "400":
          description: Invalid Job ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Job not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to fetch job
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Report Status
      tags:
      - reports
swagger: "2.0"
