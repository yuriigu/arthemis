# Infraestrutura de banco de dados da API do Arthemis (Task #1).
#
# Apenas o PostgreSQL: o serviço da aplicação (Traefik/rede arthemis-edge) será
# integrado em uma tarefa futura de deploy. As credenciais são lidas do arquivo
# .env do diretório (o Compose carrega o .env automaticamente).
#
# Uso: docker compose up -d
name: arthemis-api

services:
  postgres:
    image: postgres:16
    container_name: arthemis-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

networks:
  api-internal:
    driver: bridge
