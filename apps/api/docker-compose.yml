# Infraestrutura do backend: PostgreSQL 16 e API NestJS.
# Uso: docker compose up -d --build
name: arthemis-api

services:
  postgres:
    image: postgres:16
    container_name: arthemis-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arthemis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arthemis_password}
      POSTGRES_DB: ${POSTGRES_DB:-arthemis_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arthemis_user} -d ${POSTGRES_DB:-arthemis_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arthemis-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8081
      SERVICE_NAME: ${SERVICE_NAME:-arthemis-api}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-arthemis_user}:${POSTGRES_PASSWORD:-arthemis_password}@postgres:5432/${POSTGRES_DB:-arthemis_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-arthemis-dev-only-jwt-secret-change-me-9f4b7e2a-0123456789}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - api-internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8081/healthcheck').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: arthemis_api_postgres_data

networks:
  api-internal:
    name: arthemis-api_api-internal
    driver: bridge
