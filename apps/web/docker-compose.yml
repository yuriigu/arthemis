# Frontend Next.js do Arthemis (apps/web).
#
# Serviço padrão (`web`): desenvolvimento com hot-reload na porta 3000,
# montando o código-fonte via bind mount.
# Produção: docker compose --profile prod up --build (serviço `web-prod`,
# imagem multi-stage `runner` do Dockerfile).
#
# Integração com o backend: `api-internal` é EXTERNA e é criada pelo Compose
# da API (PostgreSQL + NestJS). Suba o backend antes do frontend:
#   docker compose -f ../api/docker-compose.yml up -d --build
name: arthemis-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: arthemis-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8081}
    extra_hosts:
      # Fallback para desenvolvimento com a API executada no host. Em Docker,
      # o padrão é o serviço `api` do Compose do backend.
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    networks:
      - default
      - api-internal

  web-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: arthemis-web-prod
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - default
      - api-internal

volumes:
  web_node_modules:
  web_next_cache:

networks:
  # Rede do backend (PostgreSQL/NestJS) criada por apps/api/docker-compose.yml
  api-internal:
    external: true
    name: arthemis-api_api-internal
