# Frontend Next.js do Arthemis (apps/web).
#
# Serviço padrão (`web`): desenvolvimento com hot-reload na porta 3000,
# montando o código-fonte via bind mount.
# Produção: docker compose --profile prod up --build (serviço `web-prod`,
# imagem multi-stage `runner` do Dockerfile).
#
# Integração com o backend: a rede `api-internal` é EXTERNA e é criada pelo
# Compose da API (apps/api). Suba a API/banco antes (se ainda não estiverem
# no ar):
#   docker compose -f ../api/docker-compose.yml up -d
name: arthemis-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: arthemis-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    networks:
      - default
      - api-internal

  web-prod:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    container_name: arthemis-web-prod
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    restart: unless-stopped
    networks:
      - default
      - api-internal

volumes:
  web_node_modules:
  web_next_cache:

networks:
  # Rede do backend (PostgreSQL/NestJS) criada por apps/api/docker-compose.yml
  api-internal:
    external: true
    name: arthemis-api_api-internal
