name: arthemis

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: arthemis
      POSTGRES_USER: arthemis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:3001
      JWT_TOKEN: ${JWT_TOKEN:?Set JWT_TOKEN in the environment}
      DATABASE_URL: postgresql://arthemis:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}@db:5432/arthemis?schema=public
    volumes:
      - ./apps/api:/workspace/apps/api
      - ./packages/database:/workspace/packages/database
      - api_node_modules:/workspace/apps/api/node_modules
      - database_node_modules:/workspace/packages/database/node_modules
      - workspace_node_modules:/workspace/node_modules
      - database_generated:/workspace/packages/database/generated
    command:
      - sh
      - -c
      - pnpm --filter @arthemis/database exec prisma migrate deploy && pnpm --filter @arthemis/database db:seed && pnpm --filter @arthemis/api exec nest start --watch
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      NODE_ENV: development
      PORT: 3001
      ARTHEMIS_API_URL: http://api:3000/api
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/apps/web/node_modules
      - web_next:/workspace/apps/web/.next
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  api_node_modules:
  database_node_modules:
  workspace_node_modules:
  database_generated:
  web_node_modules:
  web_next:
