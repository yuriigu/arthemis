{{define "layout"}}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Relatório Arthemis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 30px;
            background-color: #ffffff;
            line-height: 1.5;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.05em;
        }

        .logo span {
            color: #63f176;
        }

        .report-meta {
            text-align: right;
            font-size: 12px;
            color: #64748b;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
            margin-top: 0;
        }

        .subtitle {
            font-size: 16px;
            color: #475569;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #3da759;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
            margin-top: 35px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .card h4 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #0f172a;
            font-size: 16px;
        }

        .card p {
            margin: 0;
            color: #475569;
            font-size: 14px;
            line-height: 1.6;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .badge {
            background-color: #e0e7ff;
            color: #3da759;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 500;
            display: inline-block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        th {
            background-color: #f1f5f9;
            color: #475569;
            text-align: left;
            padding: 10px 12px;
            font-size: 13px;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 12px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
        }

        .footer {
            margin-top: 50px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
            text-align: center;
            font-size: 11px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Arthemis<span>Watcher</span></div>
        <div class="report-meta">
            <div>Gerado em: {{.GeneratedAt}}</div>
            <div>ID do Job: #{{.JobID}}</div>
        </div>
    </div>

    {{template "content" .Data}}

    <div class="footer">
        Este documento foi gerado de forma automática pelo serviço Arthemis Watcher.
    </div>
</body>
</html>
{{end}}
